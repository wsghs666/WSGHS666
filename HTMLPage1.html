    <script>
function add(num1, num2) {
            num1=num1.toString();
            num2=num2.toString();
            var index1 = num1.indexOf(".");
            var index2 = num2.indexOf(".");
            var ws1 = 0;
                var ws2 = 0;

            }
            if (index2 != -1) {
                ws2 = num2.split(".")[1].length;
            }
            var biggerweishu1 = Math.max(ws1, ws2);
            var smallerweishu1 = Math.min(ws1, ws2);
            var bigger2 = Math.min(num1, num2);
            var smaller2 = Math.max(num1, num2);
            var zerocounter = biggerweishu1 - smallerweishu1;
            num1 = num1.replace(".", "");
            num2 = num2.replace(".", "");
            if(ws1>ws2){
                for (var i = 0; i < zerocounter; i++) {
                    num2 += "0";
                }
            }else if(ws1<ws2){
                for (var i = 0; i < zerocounter; i++) {
                    num1 += "0";
                }
            }

            var beishu = 1;
            for (var i = 0; i < biggerweishu1; i++) {
                beishu *= 10;
            }
            var sum = parseInt(num1) + parseInt(num2);
            sum=sum/beishu;
            return sum;
}
